<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>xairos</title>
<style>
/* ===== Design tokens (light / dark) ===== */
:root{
  --primary:71,114,250;
  --grey:25,25,25;
  --bg:255,255,255;
  --rail:242,245,254;
  --side:250,251,255;
  --hover:25,25,25;
  --pop:255,255,255;
  --p-high:225,62,57; --p-med:250,168,12; --p-low:71,114,250;
  --line:rgba(var(--grey),.06);
  --t1:rgba(var(--grey),.9); --t2:rgba(var(--grey),.6); --t3:rgba(var(--grey),.4); --t4:rgba(var(--grey),.2);
  --shadow:0 6px 24px rgba(0,0,0,.12),0 1px 3px rgba(0,0,0,.08);
  --radius:8px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --grey:255,255,255; --bg:36,36,36; --rail:28,28,28; --side:32,32,32; --hover:255,255,255; --pop:44,44,44;
  --line:rgba(255,255,255,.07); --shadow:0 6px 24px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4);
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --grey:255,255,255; --bg:36,36,36; --rail:28,28,28; --side:32,32,32; --hover:255,255,255; --pop:44,44,44;
    --line:rgba(255,255,255,.07); --shadow:0 6px 24px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:rgb(var(--bg));color:var(--t1);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{cursor:default}
input,textarea,select{font:inherit;color:inherit}
select{background:rgba(var(--grey),.03);border:1px solid var(--line);border-radius:6px;padding:5px 6px;outline:0}
svg{display:block}
.app{display:flex;height:100vh}

/* ===== icon rail ===== */
.rail{width:52px;flex:none;background:rgb(var(--rail));display:flex;flex-direction:column;align-items:center;padding:14px 0 12px;gap:6px}
.avatar{width:30px;height:30px;border-radius:50%;color:#fff;font-weight:600;font-size:12px;display:grid;place-items:center;flex:none}
#acct-btn{margin-bottom:10px}
.rail-btn{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:var(--t3);position:relative}
.rail-btn:hover{color:var(--t2);background:rgba(var(--hover),.05)}
.rail-btn.on{color:rgb(var(--primary))}
.rail-btn svg{width:22px;height:22px}
.rail .grow{flex:1}
.tip{position:absolute;left:44px;top:50%;transform:translateY(-50%);background:rgba(20,20,20,.9);color:#fff;font-size:12px;padding:3px 8px;border-radius:4px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s;z-index:50}
.rail-btn:hover .tip{opacity:1;transition-delay:.4s}
.sync svg{width:20px;height:20px}
.sync.syncing svg{animation:spin 1s linear infinite;color:rgb(var(--primary))}
.sync.err{color:rgb(var(--p-high))}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== list sidebar ===== */
.side{width:248px;flex:none;background:rgb(var(--side));border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.side-scroll{flex:1;overflow:auto;padding:10px 8px 16px}
.nav-item{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:6px;color:var(--t1);cursor:pointer;user-select:none}
.nav-item:hover{background:rgba(var(--hover),.04)}
.nav-item.on{background:rgba(var(--primary),.1)}
.nav-item .ico{width:18px;height:18px;color:var(--t3);flex:none}
.nav-item.on .ico{color:rgb(var(--primary))}
.nav-item .name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-item .cnt{font-size:12px;color:var(--t3)}
.nav-item .shared{width:14px;height:14px;color:var(--t3)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;margin:0 4.5px}
.side-sep{height:1px;background:var(--line);margin:8px 10px}
.side-head{display:flex;align-items:center;justify-content:space-between;height:32px;padding:0 10px;color:var(--t3);font-size:12px;margin-top:6px}
.side-head button{width:22px;height:22px;border-radius:4px;display:grid;place-items:center;color:var(--t3);opacity:0}
.side-head:hover button{opacity:1}
.side-head button:hover{background:rgba(var(--hover),.06);color:var(--t2)}
.side-head button svg{width:14px;height:14px}
.side-head .caret{display:flex;align-items:center;gap:4px;cursor:pointer}
.side-head .caret svg{width:12px;height:12px;transition:transform .15s}
.side-head.closed .caret svg{transform:rotate(-90deg)}

/* ===== main column ===== */
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:rgb(var(--bg))}
.topbar{height:56px;flex:none;display:flex;align-items:center;gap:8px;padding:0 20px 0 24px}
.topbar h1{font-size:20px;font-weight:600;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px}
.topbar h1 .badge{font-size:11px;font-weight:500;color:var(--t3);border:1px solid var(--line);border-radius:10px;padding:1px 8px}
.icon-btn{width:30px;height:30px;border-radius:6px;display:grid;place-items:center;color:var(--t3);flex:none}
.icon-btn:hover{background:rgba(var(--hover),.05);color:var(--t2)}
.icon-btn.on{color:rgb(var(--primary))}
.icon-btn svg{width:18px;height:18px}
.menu-toggle{display:none}
.content{flex:1;overflow:auto;padding:0 24px 40px}

/* quick add */
.qa{position:relative;display:flex;align-items:center;gap:8px;height:40px;padding:0 10px 0 12px;border-radius:var(--radius);background:rgba(var(--grey),.04);border:1px solid transparent;margin-bottom:10px;transition:border-color .15s,background .15s}
.qa:focus-within{background:rgb(var(--bg));border-color:rgba(var(--primary),.6)}
.qa svg.plus{width:16px;height:16px;color:var(--t3);flex:none}
.qa input{flex:1;border:0;outline:0;background:none;height:100%;min-width:0}
.qa input::placeholder{color:var(--t3)}
.chips{display:flex;gap:4px;flex-wrap:nowrap;overflow:hidden}
.chip{font-size:12px;padding:1px 7px;border-radius:4px;background:rgba(var(--primary),.1);color:rgb(var(--primary));white-space:nowrap}
.chip.pri-5{background:rgba(var(--p-high),.12);color:rgb(var(--p-high))}
.chip.pri-3{background:rgba(var(--p-med),.15);color:rgb(var(--p-med))}

/* sections + rows */
.sec{margin-top:6px;border-radius:8px}
.sec-h{display:flex;align-items:center;gap:6px;height:32px;font-size:13px;font-weight:600;color:var(--t1);cursor:pointer;user-select:none}
.sec-h svg{width:12px;height:12px;color:var(--t3);transition:transform .15s}
.sec.closed .sec-h svg{transform:rotate(-90deg)}
.sec.closed .rows{display:none}
.sec-h .n{color:var(--t3);font-weight:400}
.row{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 10px;border-radius:6px;position:relative;cursor:default}
.row::after{content:"";position:absolute;left:38px;right:10px;bottom:0;height:1px;background:var(--line)}
.row:hover{background:rgba(var(--hover),.03)}
.row.sel{background:rgba(var(--primary),.08)}
.row.sel::after,.row:hover::after{opacity:0}
.row .title{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:9px 0}
.row .meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--t3);flex:none}
.row .meta .late{color:rgb(var(--p-high))}
.row .meta .soon{color:rgb(var(--primary))}
.row .meta .tag{padding:0 6px;border-radius:9px;background:rgba(var(--grey),.06);color:var(--t2)}
.row .meta .sub{display:flex;align-items:center;gap:2px}
.row .meta svg{width:12px;height:12px}
.row .meta .avatar{width:18px;height:18px;font-size:9px}
.row.done .title{color:var(--t3);text-decoration:line-through}
.row.leaving{animation:leave .45s ease forwards}
@keyframes leave{0%{opacity:1}60%{opacity:.5}100%{opacity:0;transform:translateX(8px)}}
.row[draggable="true"]{cursor:grab}

/* drag & drop */
.dragging{opacity:.4}
.drop-over{background:rgba(var(--primary),.1)!important;box-shadow:inset 0 0 0 1px rgba(var(--primary),.45)}
.row.drop-before{box-shadow:inset 0 2px 0 rgb(var(--primary))}
.row.drop-after{box-shadow:inset 0 -2px 0 rgb(var(--primary))}

/* checkbox */
.cb{width:18px;height:18px;flex:none;border-radius:4px;border:1.5px solid var(--t4);display:grid;place-items:center;transition:background .15s,border-color .15s}
.cb:hover{border-color:var(--t3)}
.cb.p5{border-color:rgb(var(--p-high));background:rgba(var(--p-high),.08)}
.cb.p3{border-color:rgb(var(--p-med));background:rgba(var(--p-med),.08)}
.cb.p1{border-color:rgb(var(--p-low));background:rgba(var(--p-low),.08)}
.cb svg{width:12px;height:12px;color:#fff;opacity:0;transform:scale(.6);transition:all .15s}
.cb.on{background:var(--t4);border-color:transparent}
.cb.on svg{opacity:1;transform:none}
.cb.on.p5,.cb.on.p3,.cb.on.p1{background:var(--t4);border-color:transparent}
.cb.round{border-radius:50%}
.cb:disabled{opacity:.5}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;color:var(--t3);text-align:center;gap:10px}
.empty svg{width:120px;height:96px}
.empty b{color:var(--t2);font-weight:500}

/* kanban */
.kanban{display:flex;gap:14px;align-items:flex-start;overflow-x:auto;padding-bottom:12px}
.kcol{width:270px;flex:none;background:rgba(var(--grey),.025);border-radius:10px;padding:8px;min-height:80px}
.kcol .sec-h{padding:0 6px}
.kcol .row{background:rgb(var(--bg));margin-bottom:6px;box-shadow:0 0 0 1px var(--line);border-radius:8px}
.kcol .row::after{display:none}

/* ===== detail pane ===== */
.detail{width:380px;flex:none;border-left:1px solid var(--line);background:rgb(var(--bg));display:flex;flex-direction:column}
.detail.hidden{display:none}
.d-top{height:56px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px 0 16px;border-bottom:1px solid var(--line)}
.d-date{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--t2);padding:4px 8px;border-radius:6px;min-width:0}
.d-date span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-date:hover{background:rgba(var(--hover),.05)}
.d-date.late{color:rgb(var(--p-high))}
.d-date.set{color:rgb(var(--primary))}
.d-date svg{width:16px;height:16px;flex:none}
.d-top .sp{flex:1}
.flag svg{width:18px;height:18px}
.flag.p5{color:rgb(var(--p-high))}.flag.p3{color:rgb(var(--p-med))}.flag.p1{color:rgb(var(--p-low))}
.d-ro{font-size:12px;color:var(--t3);background:rgba(var(--grey),.05);padding:6px 20px}
.d-body{flex:1;overflow:auto;padding:16px 20px}
.d-title{width:100%;border:0;outline:0;resize:none;background:none;font-size:18px;font-weight:600;line-height:1.4;padding:0;overflow:hidden}
.d-desc{width:100%;border:0;outline:0;resize:none;background:none;color:var(--t1);padding:8px 0;min-height:80px;overflow:hidden}
.d-desc::placeholder,.d-title::placeholder{color:var(--t4)}
.ck{display:flex;align-items:center;gap:10px;min-height:34px}
.ck input{flex:1;border:0;outline:0;background:none;padding:6px 0}
.ck.done input{color:var(--t3);text-decoration:line-through}
.ck .x{opacity:0;color:var(--t3)}
.ck:hover .x{opacity:1}
.ck .cb{width:16px;height:16px}
.add-ck{display:flex;align-items:center;gap:10px;color:var(--t3);min-height:34px}
.add-ck input{flex:1;border:0;outline:0;background:none}
.add-ck svg{width:16px;height:16px}
.d-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.d-tags .tag{font-size:12px;padding:2px 8px;border-radius:10px;background:rgba(var(--primary),.1);color:rgb(var(--primary))}
.d-info{display:flex;flex-direction:column;gap:6px;margin-top:14px;font-size:12px;color:var(--t3)}
.d-info div{display:flex;align-items:center;gap:6px}
.d-info svg{width:14px;height:14px}
.d-foot{height:44px;flex:none;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 16px;color:var(--t2);font-size:13px}
.d-foot .lst{display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:6px}
.d-foot .lst:hover{background:rgba(var(--hover),.05)}
.d-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--t3);gap:8px}
.d-empty svg{width:72px;height:72px;opacity:.6}

/* ===== popovers ===== */
.pop{position:fixed;z-index:100;background:rgb(var(--pop));border-radius:10px;box-shadow:var(--shadow);border:1px solid var(--line);padding:6px;min-width:180px;max-height:calc(100vh - 16px);overflow:auto}
.pop .mi{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:6px;cursor:pointer;white-space:nowrap}
.pop .mi:hover{background:rgba(var(--hover),.05)}
.pop .mi svg{width:16px;height:16px}
.pop .mi .kbd{margin-left:auto;font-size:12px;color:var(--t3)}
.pop .mi.danger{color:rgb(var(--p-high))}
.pop .sep{height:1px;background:var(--line);margin:4px 6px}
.pop .row-q{display:flex;justify-content:space-between;padding:6px 6px 10px;gap:4px}
.pop .row-q button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--t3);padding:6px 0;border-radius:6px}
.pop .row-q button:hover{background:rgba(var(--hover),.05);color:rgb(var(--primary))}
.pop .row-q svg{width:20px;height:20px}
.pop .fld{display:flex;align-items:center;gap:8px;padding:4px 6px}
.pop .fld .lab{width:52px;flex:none;color:var(--t3);font-size:12px}
.pop .fld input:not([type=checkbox]),.pop .fld select{flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:rgba(var(--grey),.03);outline:0}
.pop .fld input:focus{border-color:rgba(var(--primary),.6)}
.pop .opts{display:flex;flex-direction:column;gap:2px;flex:1}
.pop .opt{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;padding:2px 0}
.pop .days{display:flex;gap:4px;flex:1}
.pop .days button{width:26px;height:26px;border-radius:50%;font-size:11px;background:rgba(var(--grey),.05);color:var(--t2)}
.pop .days button.on{background:rgb(var(--primary));color:#fff}
.pop .btns{display:flex;gap:8px;padding:8px 6px 4px}
.btn{height:32px;padding:0 14px;border-radius:6px;font-size:13px;flex:1;white-space:nowrap}
.btn.pri{background:rgb(var(--primary));color:#fff}
.btn.pri:hover{filter:brightness(1.07)}
.btn.pri:disabled{opacity:.6}
.btn.sec{background:rgba(var(--grey),.06)}
.btn.sec:hover{background:rgba(var(--grey),.1)}
.pop h4{margin:4px 8px 8px;font-size:13px;font-weight:600}
.pop .note{font-size:12px;color:var(--t3);margin:6px 8px}
.pop .err{font-size:12px;color:rgb(var(--p-high));margin:6px 8px}
.pop .dlg-input{width:calc(100% - 16px);margin:0 8px;border:1px solid var(--line);border-radius:6px;padding:8px;background:rgba(var(--grey),.03);outline:0}
.pop .dlg-input:focus{border-color:rgba(var(--primary),.6)}
.swatches{display:flex;gap:8px;padding:10px 8px 2px}
.swatches button{width:20px;height:20px;border-radius:50%;box-shadow:0 0 0 2px transparent}
.swatches button.on{box-shadow:0 0 0 2px rgb(var(--pop)),0 0 0 4px currentColor}
.acct{display:flex;align-items:center;gap:10px;padding:8px 10px 10px}
.acct .avatar{width:36px;height:36px;font-size:14px}
.acct .n{font-weight:600}
.acct .e{font-size:12px;color:var(--t3)}
.member{display:flex;align-items:center;gap:10px;padding:6px 8px}
.member .who{flex:1;min-width:0}
.member .who div:last-child{font-size:12px;color:var(--t3);overflow:hidden;text-overflow:ellipsis}
.member select{flex:none}
.invite{display:flex;gap:6px;padding:0 8px}
.invite input{flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:rgba(var(--grey),.03);outline:0}
.invite .btn{flex:none}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);opacity:0;background:rgba(30,30,30,.92);color:#fff;border-radius:8px;padding:10px 14px;display:flex;gap:16px;align-items:center;font-size:13px;transition:all .2s;z-index:200;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast button{color:#8aa4ff;font-weight:600}

/* reminder cards */
.rem-stack{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:10px;z-index:150;width:320px;max-width:calc(100vw - 40px)}
.rem-card{background:rgb(var(--pop));border-radius:12px;box-shadow:var(--shadow);border:1px solid var(--line);padding:12px 14px;animation:pop .2s ease}
@keyframes pop{from{opacity:0;transform:translateY(10px)}}
.rem-h{display:flex;align-items:center;gap:6px;font-size:12px;color:rgb(var(--primary));font-weight:600}
.rem-h svg{width:14px;height:14px}
.rem-h .icon-btn{margin-left:auto;width:24px;height:24px}
.rem-t{font-weight:600;margin:6px 0 2px}
.rem-s{font-size:12px;color:var(--t3);margin-bottom:10px}
.rem-b{display:flex;gap:6px}

/* ===== calendar ===== */
.cal{display:flex;flex-direction:column;height:100%}
.cal-grid{flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;border-top:1px solid var(--line);border-left:1px solid var(--line);min-height:520px}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);font-size:12px;color:var(--t3);padding:0 0 6px}
.cal-dow div{padding-left:8px}
.cell{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px;min-width:0;overflow:hidden;cursor:default}
.cell:hover{background:rgba(var(--hover),.02)}
.cell .d{font-size:12px;color:var(--t2);width:22px;height:22px;display:grid;place-items:center;border-radius:50%;margin-bottom:2px}
.cell.other .d{color:var(--t4)}
.cell.today .d{background:rgb(var(--primary));color:#fff}
.ev{font-size:12px;line-height:20px;height:20px;padding:0 6px;border-radius:4px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;background:rgba(var(--c),.15);color:rgb(var(--c))}
:root[data-theme="dark"] .ev{background:rgba(var(--c),.25)}
.ev.done{opacity:.45;text-decoration:line-through}
.ev.ghost{background:transparent;box-shadow:inset 0 0 0 1px rgba(var(--c),.45);opacity:.75}
.more{font-size:11px;color:var(--t3);padding-left:6px}
.seg{display:flex;background:rgba(var(--grey),.05);border-radius:6px;padding:2px}
.seg button{padding:3px 10px;border-radius:5px;font-size:12px;color:var(--t2)}
.seg button.on{background:rgb(var(--bg));color:var(--t1);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* ===== matrix ===== */
.matrix{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:12px;height:calc(100vh - 80px);padding-bottom:16px}
.quad{background:rgba(var(--grey),.025);border-radius:10px;padding:10px 6px 6px;display:flex;flex-direction:column;min-height:0}
.quad h3{margin:0 8px 6px;font-size:14px;display:flex;align-items:center;gap:8px}
.quad h3 .num{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;color:#fff;font-size:12px}
.quad .list{flex:1;overflow:auto}
.quad .row::after{left:36px}
.quad .qa{height:34px;margin:4px 4px 0;background:none}
.quad .qa:focus-within{background:rgb(var(--bg))}

/* ===== focus ===== */
.focus{display:flex;gap:40px;height:100%;padding-top:10px}
.focus-l{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;min-width:0}
.ring{position:relative;width:280px;height:280px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .time{position:absolute;inset:0;display:grid;place-items:center;font-size:52px;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:1px}
.ring .lbl{position:absolute;left:0;right:0;top:64%;text-align:center;font-size:13px;color:var(--t3)}
.f-btns{display:flex;gap:12px}
.f-btns .btn{flex:none;width:120px;height:40px;border-radius:20px;font-size:14px}
.focus-r{width:300px;flex:none;border-left:1px solid var(--line);padding-left:24px;overflow:auto}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 18px}
.stat{background:rgba(var(--grey),.03);border-radius:8px;padding:10px 12px}
.stat .k{font-size:12px;color:var(--t3)}
.stat .v{font-size:22px;font-weight:600}
.rec{display:flex;justify-content:space-between;font-size:13px;padding:8px 0;border-bottom:1px solid var(--line);color:var(--t2)}

/* ===== habits ===== */
.habit{display:flex;align-items:center;gap:14px;padding:12px 10px;border-radius:8px;border-bottom:1px solid var(--line)}
.habit:hover{background:rgba(var(--hover),.02)}
.h-ico{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;flex:none}
.h-info{flex:1;min-width:0}
.h-info .s{font-size:12px;color:var(--t3)}
.week{display:flex;gap:10px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--t3)}
.wd button{width:26px;height:26px;border-radius:50%;border:1.5px dashed var(--t4);display:grid;place-items:center}
.wd button.on{border:0;background:rgb(var(--c));color:#fff}
.wd button svg{width:14px;height:14px}
.wd.today{color:rgb(var(--primary));font-weight:600}

/* search */
.search-box{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:var(--radius);background:rgba(var(--grey),.04);margin-bottom:12px}
.search-box input{flex:1;border:0;outline:0;background:none}
.search-box svg{width:16px;height:16px;color:var(--t3)}
mark{background:rgba(var(--p-med),.3);color:inherit;border-radius:2px}

/* ===== auth ===== */
.auth{position:fixed;inset:0;z-index:300;background:rgb(var(--rail));display:grid;place-items:center;padding:16px;overflow:auto}
.auth-card{width:360px;max-width:100%;background:rgb(var(--bg));border-radius:14px;box-shadow:var(--shadow);padding:28px 26px 22px}
.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;margin-bottom:6px}
.brand .logo{width:32px;height:32px;border-radius:9px;background:rgb(var(--primary));display:grid;place-items:center;color:#fff}
.brand .logo svg{width:20px;height:20px}
.auth-sub{color:var(--t3);font-size:13px;margin-bottom:18px}
.auth .tabs{display:flex;gap:4px;background:rgba(var(--grey),.05);border-radius:8px;padding:3px;margin-bottom:16px}
.auth .tabs button{flex:1;height:30px;border-radius:6px;font-size:13px;color:var(--t2)}
.auth .tabs button.on{background:rgb(var(--bg));color:var(--t1);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.auth label{display:block;font-size:12px;color:var(--t2);margin:10px 0 4px}
.auth input{width:100%;height:38px;border:1px solid rgba(var(--grey),.12);border-radius:8px;padding:0 10px;background:rgb(var(--bg));outline:0}
.auth input:focus{border-color:rgba(var(--primary),.7)}
.auth .btn{width:100%;height:40px;margin-top:18px;font-size:14px}
.auth .err{color:rgb(var(--p-high));font-size:12px;margin-top:10px;min-height:16px}
.auth .fine{font-size:11px;color:var(--t3);margin-top:12px;line-height:1.5}

::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(var(--grey),.12);border-radius:4px}
::-webkit-scrollbar-track{background:transparent}

/* ===== responsive ===== */
.scrim{display:none}
@media (max-width:1100px){
  .detail{position:fixed;right:0;top:0;bottom:0;z-index:60;box-shadow:var(--shadow)}
}
@media (max-width:760px){
  .rail{position:fixed;bottom:0;left:0;right:0;width:auto;height:52px;flex-direction:row;justify-content:space-around;padding:0 4px;z-index:70;border-top:1px solid var(--line);gap:0}
  .rail .grow,.rail .sync{display:none}
  #acct-btn{margin:0}
  .tip{display:none}
  .app{padding-bottom:52px;height:100vh}
  .side{position:fixed;left:0;top:0;bottom:52px;z-index:80;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow)}
  .side.open{transform:none}
  .scrim.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:75}
  .menu-toggle{display:grid}
  .topbar{padding:0 10px 0 12px}
  .content{padding:0 16px 40px}
  .detail{width:100%;bottom:52px}
  .focus{flex-direction:column;gap:20px}
  .focus-r{width:auto;border:0;padding:0}
  .ring{width:220px;height:220px}
  .matrix{grid-template-columns:1fr;grid-template-rows:none;height:auto}
  .quad{min-height:200px}
  .week{gap:4px}
  .row .meta .tag{display:none}
  .rem-stack{bottom:64px;right:10px}
}
</style>
</head>
<body>
<div class="app" id="app" hidden>
  <nav class="rail" id="rail"></nav>
  <aside class="side" id="side"></aside>
  <div class="scrim" id="scrim"></div>
  <main class="main" id="main"></main>
  <section class="detail hidden" id="detail"></section>
</div>
<div class="auth" id="auth" hidden></div>
<div class="rem-stack" id="rem-stack"></div>
<div class="toast" id="toast"><span id="toast-msg"></span><button id="toast-undo">Undo</button></div>
<input type="file" id="import-file" accept="application/json" hidden>

  nodate:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M6 18L18 6"/></svg>',
  nextweek:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="16" rx="3"/><path d="M3.5 9.5h17M10 13l3 2.5-3 2.5"/></svg>',

  users:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8.5" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 5.2a3.5 3.5 0 0 1 0 6.6M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/></svg>',

};
const emptyArt = `<svg viewBox="0 0 120 96" fill="none"><rect x="22" y="14" width="76" height="68" rx="10" fill="rgba(var(--primary),.08)"/><rect x="34" y="30" width="10" height="10" rx="3" stroke="rgb(var(--primary))" stroke-width="2"/><path d="M52 35h30" stroke="rgba(var(--primary),.5)" stroke-width="3" stroke-linecap="round"/><rect x="34" y="50" width="10" height="10" rx="3" stroke="rgba(var(--primary),.5)" stroke-width="2"/><path d="M52 55h22" stroke="rgba(var(--primary),.3)" stroke-width="3" stroke-linecap="round"/><circle cx="92" cy="72" r="13" fill="rgb(var(--primary))"/><path d="M86 72l4 4 8-8" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

/* ---------------- small utils ---------------- */
const $ = (sel,root=document) => root.querySelector(sel);
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const h = html => { const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstChild; };
const randHex = n => [...crypto.getRandomValues(new Uint8Array(n))].map(b=>b.toString(16).padStart(2,'0')).join('');
const uid = () => randHex(8);
const clone = o => JSON.parse(JSON.stringify(o));
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const lsGet = k => { try{ const v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ return null; } };
const lsSet = (k,v) => { try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ console.warn('storage failed', e); } };
const lsDel = k => { try{ localStorage.removeItem(k); }catch(e){} };
function apiErr(status,msg){ const e=new Error(msg); e.status=status; return e; }

/* ---------------- dates ---------------- */
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const todayD = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const TODAY = () => ymd(todayD());
const dayDiff = s => Math.round((parseYmd(s) - todayD())/864e5);
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtTime(t){ if(!t) return ''; const [hh,mm] = t.split(':').map(Number); return `${hh%12||12}:${pad(mm)}${hh<12?' AM':' PM'}`; }
function fmtDue(due,time){
  if(!due) return '';
  const n = dayDiff(due), d = parseYmd(due);
  let s;
  if(n===0) s='Today'; else if(n===1) s='Tomorrow'; else if(n===-1) s='Yesterday';
  else if(n>1 && n<7) s=DOW[d.getDay()];
  else s = `${MON[d.getMonth()]} ${d.getDate()}` + (d.getFullYear()!==todayD().getFullYear()?`, ${d.getFullYear()}`:'');
  return time ? `${s}, ${fmtTime(time)}` : s;
}
const dueClass = t => { if(!t.due||t.done) return ''; const n=dayDiff(t.due); return n<0?'late':(n===0?'soon':''); };
const nextMonday = () => ymd(addDays(todayD(), ((8-todayD().getDay())%7)||7));

/* ---------------- repeat rules ---------------- */
// rule = {freq:'daily'|'weekly'|'monthly'|'yearly', interval, byDay:[0-6], dom, from:'due'|'completion', until:ymd|null, count:n|null, done:n}
function addMonthsClamp(d,n,dom){ const y=d.getFullYear(), m=d.getMonth()+n; const last=new Date(y,m+1,0).getDate(); return new Date(y,m,Math.min(dom||d.getDate(),last)); }
function nextDue(rule, fromYmd){
  const d = parseYmd(fromYmd), iv = Math.max(1, rule.interval||1);
  switch(rule.freq){
    case 'daily': return ymd(addDays(d,iv));
    case 'weekly': {
      const days = (rule.byDay&&rule.byDay.length) ? rule.byDay : [d.getDay()];
      const weekStart = x => addDays(x,-x.getDay()).getTime();
      for(let i=1;i<=7;i++){ const c = addDays(d,i); if(days.includes(c.getDay())) return ymd(weekStart(c)!==weekStart(d) ? addDays(c,(iv-1)*7) : c); }
      return ymd(addDays(d,7*iv));
    }
    case 'monthly': return ymd(addMonthsClamp(d, iv, rule.dom));
    case 'yearly': return ymd(addMonthsClamp(d, 12*iv, rule.dom));
  }
  return ymd(addDays(d,1));
}
function repeatLabel(r){
  if(!r) return '';
  const iv = r.interval||1, days = (r.byDay||[]).slice().sort();
  let s;
  if(r.freq==='daily') s = iv===1?'Daily':`Every ${iv} days`;
  else if(r.freq==='weekly'){
    if(iv===1 && days.join()==='1,2,3,4,5') s='Weekdays';
    else s = (iv===1?'Weekly':`Every ${iv} weeks`) + (days.length?' on '+days.map(x=>DOW[x]).join(', '):'');
  }
  else if(r.freq==='monthly') s = (iv===1?'Monthly':`Every ${iv} months`) + (r.dom?` on day ${r.dom}`:'');
  else s = iv===1?'Yearly':`Every ${iv} years`;
  if(r.from==='completion') s += ' (after completion)';
  if(r.until) s += `, until ${fmtDue(r.until)}`;
  return s;
}
function firstOccurrence(rule){
  const t0 = todayD();
  if(rule.freq==='weekly' && rule.byDay?.length){ for(let i=0;i<7;i++){ const c=addDays(t0,i); if(rule.byDay.includes(c.getDay())) return ymd(c); } }
  return ymd(t0);
}
function occurrences(t, fromY, toY){
  const out = [];
  if(!t.repeat || !t.due || t.done || t.repeat.from==='completion') return out;
  let d = t.due, n = t.repeat.done||0;
  for(let i=0;i<120;i++){
    d = nextDue(t.repeat, d); n++;
    if(d > toY) break;
    if(t.repeat.until && d > t.repeat.until) break;
    if(t.repeat.count && n >= t.repeat.count) break;
    if(d >= fromY) out.push(d);
  }
  return out;
}

/* ---------------- quick-add parser ---------------- */
const WD = {sun:0,mon:1,tue:2,wed:3,thu:4,fri:5,sat:6};
const wdOf = w => WD[w.toLowerCase().slice(0,3)];
function parseQuick(raw){
  let s = ' '+raw+' ';
  const out = {title:'',due:null,time:null,priority:null,tags:[],listName:null,repeat:null,chips:[]};
  const take = (re, fn) => { s = s.replace(re, (...m) => { const r = fn(...m); return r===false ? m[0] : ' '; }); };
  take(/\s!(high|med|medium|low|none|[0-3])(?=\s)/i, (_,p)=>{ p=p.toLowerCase(); out.priority = ({high:5,'3':5,med:3,medium:3,'2':3,low:1,'1':1,none:0,'0':0})[p]; });
  take(/\s#([\w-]+)(?=\s)/g, (_,t)=>{ out.tags.push(t.toLowerCase()); });
  take(/\s\^([\w-]+)(?=\s)/, (_,l)=>{ out.listName = l; });
  // repeat (before dates so "every monday" is not read as a date)
  take(/\severy\s+weekdays?(?=\s)/i, ()=>{ out.repeat={freq:'weekly',interval:1,byDay:[1,2,3,4,5]}; });
  if(!out.repeat) take(/\s(?:every\s+day|daily)(?=\s)/i, ()=>{ out.repeat={freq:'daily',interval:1}; });
  if(!out.repeat) take(/\severy\s+(\d{1,3})\s+(day|days|week|weeks|month|months|year|years)(?=\s)/i, (_,n,u)=>{ const f=u.startsWith('day')?'daily':u.startsWith('week')?'weekly':u.startsWith('month')?'monthly':'yearly'; out.repeat={freq:f,interval:+n}; });
  if(!out.repeat) take(/\s(?:every\s+month|monthly)(?=\s)/i, ()=>{ out.repeat={freq:'monthly',interval:1}; });
  if(!out.repeat) take(/\s(?:every\s+year|yearly|annually)(?=\s)/i, ()=>{ out.repeat={freq:'yearly',interval:1}; });
  const WDRE = '(?:sun(?:day)?|mon(?:day)?|tue(?:s|sday)?|wed(?:nesday)?|thu(?:r|rs|rsday)?|fri(?:day)?|sat(?:urday)?)';
  if(!out.repeat) take(new RegExp('\\severy\\s+('+WDRE+'(?:\\s*(?:,|and)\\s*'+WDRE+')*)(?=\\s)','i'), (_,list)=>{ out.repeat={freq:'weekly',interval:1,byDay:[...new Set(list.split(/\s*(?:,|and)\s*/i).map(wdOf))].sort()}; });
  if(!out.repeat) take(/\s(?:every\s+week|weekly)(?=\s)/i, ()=>{ out.repeat={freq:'weekly',interval:1}; });
  // time
  take(/\s(?:at\s+)?(\d{1,2})(?::(\d{2}))?\s*(am|pm)(?=\s)/i, (_,hh,mm,ap)=>{ hh=+hh%12 + (ap.toLowerCase()==='pm'?12:0); out.time=`${pad(hh)}:${pad(+(mm||0))}`; });
  if(!out.time) take(/\s(?:at\s+)?([01]?\d|2[0-3]):([0-5]\d)(?=\s)/, (_,hh,mm)=>{ out.time=`${pad(+hh)}:${mm}`; });
  if(!out.time) take(/\sat\s+(\d{1,2})(?=\s)/i, (_,hh)=>{ if(+hh>23) return false; out.time=`${pad(+hh)}:00`; });
  // date
  const t0 = todayD();
  take(/\s(today|tod)(?=\s)/i, ()=>{ out.due = ymd(t0); });
  if(!out.due) take(/\s(tomorrow|tmr|tmrw)(?=\s)/i, ()=>{ out.due = ymd(addDays(t0,1)); });
  if(!out.due) take(/\snext\s+week(?=\s)/i, ()=>{ out.due = nextMonday(); });
  if(!out.due) take(/\sin\s+(\d{1,3})\s+(day|days|week|weeks)(?=\s)/i, (_,n,u)=>{ out.due = ymd(addDays(t0, +n*(u.startsWith('week')?7:1))); });
  if(!out.due) take(/\s(?:on\s+|next\s+)?(sun(?:day)?|mon(?:day)?|tue(?:s|sday)?|wed(?:nesday)?|thu(?:r|rs|rsday)?|fri(?:day)?|sat(?:urday)?)(?=\s)/i, (_,w)=>{ const k=wdOf(w); let n=(k - t0.getDay() + 7)%7; if(n===0) n=7; out.due = ymd(addDays(t0,n)); });
  if(!out.due) take(/\s(\d{1,2})\/(\d{1,2})(?=\s)/, (_,m,d)=>{ m=+m; d=+d; if(m<1||m>12||d<1||d>31) return false; const c=new Date(t0.getFullYear(),m-1,d); if(c<t0) c.setFullYear(c.getFullYear()+1); out.due=ymd(c); });
  if(!out.due) take(/\s(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\s+(\d{1,2})(?=\s)/i, (_,m,d)=>{ const mi=MON.findIndex(x=>x.toLowerCase()===m.toLowerCase().slice(0,3)); const c=new Date(t0.getFullYear(),mi,+d); if(c<t0) c.setFullYear(c.getFullYear()+1); out.due=ymd(c); });
  if(out.repeat){
    if(!out.due) out.due = firstOccurrence(out.repeat);
    if(out.repeat.freq==='weekly' && !out.repeat.byDay) out.repeat.byDay=[parseYmd(out.due).getDay()];
    out.repeat.dom = parseYmd(out.due).getDate();
    out.repeat.from = 'due';
  }
  if(out.time && !out.due) out.due = ymd(t0);
  out.title = s.replace(/\s+/g,' ').trim();
  if(out.due) out.chips.push({cls:'', txt: fmtDue(out.due,out.time)});
  if(out.repeat) out.chips.push({cls:'', txt: '↻ '+repeatLabel(out.repeat)});
  if(out.priority) out.chips.push({cls:'pri-'+out.priority, txt: ({5:'High',3:'Medium',1:'Low'})[out.priority]});
  out.tags.forEach(t=>out.chips.push({cls:'', txt:'#'+t}));
  if(out.listName) out.chips.push({cls:'', txt:'^'+out.listName});
  return out;
}

/* =====================================================================
   LocalServer — a mock backend that lives in this browser's localStorage.
   It implements the same contract a real server would (see ROADMAP.md):
   signup/login/logout, pull(checkpoint), push(changes), findUser, leaveList.
   Every tab of this origin talks to the same "server"; BroadcastChannel
   plays the role of the WebSocket push ("needSync").
   ===================================================================== */
const SRV_KEY = 'xairos.server.v1';
const CLIENT_ID = uid();
async function pbkdf2(pw, saltHex){
  if(!crypto.subtle){ let x=0; for(const c of pw+saltHex) x=(x*31+c.charCodeAt(0))|0; return 'weak:'+x; }
  const salt = new Uint8Array(saltHex.match(/../g).map(b=>parseInt(b,16)));
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({name:'PBKDF2', salt, iterations:150000, hash:'SHA-256'}, key, 256);
  return [...new Uint8Array(bits)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
const pubUser = u => u ? {id:u.id, name:u.name, email:u.email} : null;
class LocalServer {
  constructor(){ this.chan = ('BroadcastChannel' in window) ? new BroadcastChannel('xairos-push') : null; }
  _db(){ return lsGet(SRV_KEY) || {seq:0, users:{}, sessions:{}, lists:{}, tasks:{}, habits:{}, focus:{}, revoked:{}}; }
  _save(d){ lsSet(SRV_KEY, d); }
  async _lat(){ await sleep(80 + Math.random()*80); }
  _auth(d, token){ const u = d.sessions[token]; if(!u || !d.users[u]) throw apiErr(401,'Session expired. Please sign in again.'); return u; }
  _canRead(l, me){ return !!l && !l.removed && (l.ownerId===me || !!(l.members||{})[me]); }
  _canWrite(l, me){ return !!l && !l.removed && (l.ownerId===me || (l.members||{})[me]==='edit'); }
  _people(l){ return l ? [l.ownerId, ...Object.keys(l.members||{})] : []; }
  _notify(users){ if(this.chan) this.chan.postMessage({type:'needSync', users:[...users], origin:CLIENT_ID}); }

  async signup({name, email, password}){
    await this._lat();
    email = String(email||'').trim().toLowerCase(); name = String(name||'').trim();
    if(!name) throw apiErr(400,'Please enter your name.');
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) throw apiErr(400,'Please enter a valid email.');
    if(String(password||'').length < 8) throw apiErr(400,'Password must be at least 8 characters.');
    const salt = randHex(16), hash = await pbkdf2(password, salt);
    const d = this._db();
    if(Object.values(d.users).some(u=>u.email===email)) throw apiErr(409,'An account with this email already exists.');
    const id = uid(), now = Date.now();
    d.users[id] = {id, name, email, salt, hash, created:now};
    const inbox = 'inbox-'+id;
    d.lists[inbox] = {id:inbox, name:'Inbox', color:'120,120,130', ownerId:id, members:{}, inbox:true, order:0, mtime:now, seq:++d.seq};
    const token = randHex(24); d.sessions[token] = id;
    this._save(d);
    return {token, user:pubUser(d.users[id])};
  }
  async login({email, password}){
    await this._lat();
    email = String(email||'').trim().toLowerCase();
    const u = Object.values(this._db().users).find(x=>x.email===email);
    const hash = u ? await pbkdf2(password, u.salt) : await pbkdf2(password, randHex(16));
    if(!u || hash !== u.hash) throw apiErr(401,'Wrong email or password.');
    const d = this._db(); const token = randHex(24); d.sessions[token] = u.id; this._save(d);
    return {token, user:pubUser(u)};
  }
  async logout(token){ const d=this._db(); delete d.sessions[token]; this._save(d); }
  async findUser(token, email){
    await this._lat(); const d=this._db(); this._auth(d,token);
    return pubUser(Object.values(d.users).find(u=>u.email===String(email).trim().toLowerCase()));
  }
  async leaveList(token, listId){
    await this._lat(); const d=this._db(); const me=this._auth(d,token);
    const l = d.lists[listId];
    if(!l || !(l.members||{})[me]) throw apiErr(404,'Not a member of this list.');
    const people = this._people(l);
    delete l.members[me]; l.seq = ++d.seq; l.mtime = Date.now();
    (d.revoked[me] = d.revoked[me]||[]).push({listId, seq:l.seq});
    this._save(d); this._notify(people);
  }
  async pull(token, cp){
    await this._lat(); const d=this._db(); const me=this._auth(d,token);
    const vis = new Set(Object.values(d.lists).filter(l=>this._canRead(l,me)).map(l=>l.id));
    const out = {checkpoint:d.seq, lists:[], tasks:[], habits:[], focus:[], users:[], revoked:[]};
    for(const l of Object.values(d.lists)) if(l.seq > cp && (vis.has(l.id) || (l.removed && (l.ownerId===me || (l.members||{})[me])))) out.lists.push(l);
    for(const t of Object.values(d.tasks)) if(t.seq > cp){
      if(vis.has(t.listId)) out.tasks.push(t);
      else if(t.prevListId && vis.has(t.prevListId)) out.tasks.push({id:t.id, removed:true});
    }
    for(const type of ['habits','focus']) for(const x of Object.values(d[type])) if(x.ownerId===me && x.seq > cp) out[type].push(x);
    out.revoked = (d.revoked[me]||[]).filter(r=>r.seq > cp).map(r=>r.listId);
    const people = new Set([me]);
    for(const id of vis) this._people(d.lists[id]).forEach(u=>people.add(u));
    out.users = [...people].map(u=>pubUser(d.users[u])).filter(Boolean);
    return clone(out);
  }
  async push(token, ch){
    await this._lat(); const d=this._db(); const me=this._auth(d,token);
    const id2error = {}, affected = new Set([me]);
    for(const l of ch.lists||[]){
      const ex = d.lists[l.id];
      if(ex && !this._canWrite(ex,me)){ id2error[l.id]='NO_PERMISSION'; continue; }
      if(ex && ex.mtime > l.mtime){ id2error[l.id]='STALE'; continue; }
      const isOwner = !ex || ex.ownerId===me;
      if(l.removed && !isOwner){ id2error[l.id]='NO_PERMISSION'; continue; }
      let mem = isOwner ? {...(l.members||{})} : {...(ex.members||{})};
      const owner = ex ? ex.ownerId : me;
      if(ex?.inbox) mem = {};
      for(const u of Object.keys(mem)) if(!d.users[u] || u===owner || !['edit','view'].includes(mem[u])) delete mem[u];
      const seq = ++d.seq;
      const next = {...l, ownerId:owner, members:mem, inbox:!!ex?.inbox, seq};
      const before = new Set(this._people(ex)), after = new Set(this._people(next));
      for(const u of before) if(!after.has(u)) (d.revoked[u] = d.revoked[u]||[]).push({listId:l.id, seq});
      const added = [...after].some(u=>!before.has(u));
      for(const t of Object.values(d.tasks)) if(t.listId===l.id){
        if(next.removed){ t.removed = true; t.seq = ++d.seq; }
        else if(added && ex) t.seq = ++d.seq;
      }
      d.lists[l.id] = next;
      before.forEach(u=>affected.add(u)); after.forEach(u=>affected.add(u));
    }
    for(const t of ch.tasks||[]){
      const ex = d.tasks[t.id], L = d.lists[t.listId];
      if(!this._canWrite(L,me) || (ex && ex.listId!==t.listId && !this._canWrite(d.lists[ex.listId],me))){ id2error[t.id]='NO_PERMISSION'; continue; }
      if(ex && ex.mtime > t.mtime){ id2error[t.id]='STALE'; continue; }
      const prevListId = ex && ex.listId!==t.listId ? ex.listId : (ex?.prevListId||null);
      d.tasks[t.id] = {...t, prevListId, seq:++d.seq};
      this._people(L).forEach(u=>affected.add(u));
      if(ex) this._people(d.lists[ex.listId]).forEach(u=>affected.add(u));
    }
    for(const type of ['habits','focus']) for(const x of ch[type]||[]){
      const ex = d[type][x.id];
      if(ex && ex.ownerId!==me){ id2error[x.id]='NO_PERMISSION'; continue; }
      if(ex && ex.mtime > x.mtime){ id2error[x.id]='STALE'; continue; }
      d[type][x.id] = {...x, ownerId:me, seq:++d.seq};
    }
    this._save(d); this._notify(affected);
    return {id2error, checkpoint:d.seq};
  }
}
const server = new LocalServer();

/* =====================================================================
   Client store (per account, cached in localStorage) + sync engine
   ===================================================================== */
const SESSION_KEY = 'xairos.session';
const SERVER_SESSIONS_EVT = SRV_KEY;
const TYPES = ['lists','tasks','habits','focus'];
const COLORS = ['71,114,250','225,62,57','250,168,12','52,178,107','155,89,219','0,170,200','240,110,170','120,120,130'];
// Session is per tab (sessionStorage) so two accounts can run side by side; localStorage remembers the last login.
const ssGet = k => { try{ const v=sessionStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ return null; } };
let session = ssGet(SESSION_KEY) || lsGet(SESSION_KEY);   // {token, user}
function saveSession(){ try{ sessionStorage.setItem(SESSION_KEY, JSON.stringify(session)); }catch(e){} lsSet(SESSION_KEY, session); }
let S = null;                        // client db
const prefs = Object.assign({theme:'system', kanban:false, closed:{}, sideClosed:{}}, lsGet('xairos.prefs')||{});
const savePrefs = () => lsSet('xairos.prefs', prefs);
const dataKey = () => 'xairos.data.'+session.user.id;
const emptyDb = () => ({lists:{}, tasks:{}, habits:{}, focus:{}, users:{}, checkpoint:0, dirty:{lists:{},tasks:{},habits:{},focus:{}}});
function loadLocal(){ S = Object.assign(emptyDb(), lsGet(dataKey())||{}); TYPES.forEach(t=>S.dirty[t]=S.dirty[t]||{}); }
let saveT; function saveLocal(){ clearTimeout(saveT); saveT = setTimeout(()=>lsSet(dataKey(), S), 50); }
const me = () => session.user.id;
const inboxId = () => 'inbox-'+me();

function upd(type, obj){
  obj.mtime = Math.max(Date.now(), (obj.mtime||0)+1);
  S[type][obj.id] = obj; S.dirty[type][obj.id] = obj.mtime;
  saveLocal(); scheduleSync();
}
const touch = t => upd('tasks', t);

const Sync = {state:'idle', last:null, timer:null, running:false, again:false, full:false};
function scheduleSync(ms=600){ clearTimeout(Sync.timer); Sync.timer = setTimeout(doSync, ms); }
function setSyncState(s){ Sync.state = s; const b = $('#sync-btn'); if(b) updateSyncBtn(b); }
async function doSync(){
  if(!session || !S) return;
  if(Sync.running){ Sync.again = true; return; }
  Sync.running = true; setSyncState('syncing');
  try{
    const changes = {}, sent = {}; let any = false;
    for(const type of TYPES){
      sent[type] = {...S.dirty[type]};
      changes[type] = Object.keys(sent[type]).map(id=>S[type][id]).filter(Boolean).map(clone);
      if(changes[type].length) any = true;
    }
    if(any){
      const res = await server.push(session.token, changes);
      for(const type of TYPES) for(const id in sent[type]) if(S.dirty[type][id]===sent[type][id]) delete S.dirty[type][id];
      const errs = Object.entries(res.id2error);
      if(errs.length){
        Sync.full = true;
        if(errs.some(([,e])=>e==='NO_PERMISSION')) toast('Some changes were rejected: no permission');
      }
    }
    const cp = Sync.full ? 0 : S.checkpoint; Sync.full = false;
    const p = await server.pull(session.token, cp);
    applyPull(p);
    S.checkpoint = p.checkpoint; saveLocal();
    Sync.last = Date.now(); setSyncState('ok');
    softRender(); checkReminders();
  }catch(e){
    console.warn('sync failed', e);
    if(e.status===401){ toast(e.message); return signOut(true); }
    setSyncState('error');
  }finally{
    Sync.running = false;
    if(Sync.again){ Sync.again = false; scheduleSync(50); }
  }
}
function applyPull(p){
  for(const lid of p.revoked){
    if(p.lists.some(l=>l.id===lid && !l.removed)) continue;
    delete S.lists[lid];
    for(const t of Object.values(S.tasks)) if(t.listId===lid) delete S.tasks[t.id];
  }
  for(const type of TYPES) for(const e of p[type]){
    if(S.dirty[type][e.id]) continue;
    if(e.removed){
      delete S[type][e.id];
      if(type==='lists') for(const t of Object.values(S.tasks)) if(t.listId===e.id && !S.dirty.tasks[t.id]) delete S.tasks[t.id];
    } else S[type][e.id] = e;
  }
  for(const u of p.users) S.users[u.id] = u;
  if(ui.sel && !S.tasks[ui.sel]) ui.sel = null;
}
if(server.chan) server.chan.onmessage = e => { if(session && e.data?.type==='needSync' && e.data.users.includes(me())) scheduleSync(150); };
setInterval(()=>{ if(session) scheduleSync(0); }, 60000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && session) scheduleSync(0); });
addEventListener('online', ()=>{ if(session) scheduleSync(0); });
addEventListener('storage', e=>{ if(e.key===SERVER_SESSIONS_EVT && session && !(lsGet(SRV_KEY)?.sessions||{})[session.token]) location.reload(); });

/* ---------------- accessors ---------------- */
const ui = { route:'tasks', listKey:'today', sel:null, query:'', sideOpen:false, calMonth:null, pending:false };
const allTasks = () => Object.values(S.tasks).filter(t=>!t.removed);
const live = () => allTasks().filter(t=>!t.deleted && (S.lists[t.listId] || t.listId===inboxId()));
const userLists = () => Object.values(S.lists).filter(l=>!l.removed && !l.inbox).sort((a,b)=>(a.order||0)-(b.order||0) || a.name.localeCompare(b.name));
const listById = id => S.lists[id];
const listName = id => (id===inboxId() || S.lists[id]?.inbox) ? 'Inbox' : (S.lists[id]?.name || 'Inbox');
const listColor = id => S.lists[id]?.color || COLORS[7];
const isShared = l => !!l && (Object.keys(l.members||{}).length>0 || l.ownerId!==me());
const canWrite = listId => { const l = S.lists[listId]; if(!l) return listId===inboxId(); return l.ownerId===me() || (l.members||{})[me()]==='edit'; };
const isOwner = listId => S.lists[listId]?.ownerId===me();
const allTags = () => [...new Set(live().flatMap(t=>t.tags||[]))].sort();
const ord = t => t.order ?? t.created;
function guard(t){ if(canWrite(t.listId)) return true; toast('You have view-only access to this list'); return false; }
function avatarColor(id){ let x=0; for(const c of String(id)) x=(x*33+c.charCodeAt(0))>>>0; return COLORS[x % 7]; }
function initials(name){ return (name||'?').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('') || '?'; }
const avatarHtml = (u, size) => `<span class="avatar" style="background:rgb(${avatarColor(u?.id)})${size?`;width:${size}px;height:${size}px;font-size:${Math.round(size*.45)}px`:''}" title="${esc(u?.name||'')}">${esc(initials(u?.name))}</span>`;
const userName = id => id===me() ? 'You' : (S.users[id]?.name || 'Someone');
function sortTasks(a){ return a.sort((x,y)=> (x.due||'9999').localeCompare(y.due||'9999') || ord(x)-ord(y)); }
function newTask(o={}){
  const now = Date.now();
  return {id:uid(), title:'', desc:'', listId:inboxId(), due:null, time:null, priority:0, tags:[], items:[], done:false, doneAt:null, deleted:false, created:now, order:now, repeat:null, reminders:[], snooze:null, assignee:null, createdBy:me(), ...o};
}

function applyTheme(){ const r=document.documentElement; if(prefs.theme==='system') r.removeAttribute('data-theme'); else r.setAttribute('data-theme',prefs.theme); }
const isDark = () => prefs.theme==='dark' || (prefs.theme==='system' && matchMedia('(prefers-color-scheme:dark)').matches);

function renderAuth(mode='signin', err=''){
  $('#app').hidden = true;
  const a = $('#auth'); a.hidden = false;
  a.innerHTML = `<form class="auth-card" id="auth-form" novalidate>
    <div class="brand"><span class="logo">${I.check}</span>xairos</div>
    <div class="auth-sub">Plan your day. Keep every device in step.</div>
    <div class="tabs"><button type="button" data-m="signin" class="${mode==='signin'?'on':''}">Sign in</button><button type="button" data-m="signup" class="${mode==='signup'?'on':''}">Create account</button></div>
    ${mode==='signup'?`<label for="a-name">Name</label><input id="a-name" autocomplete="name" required>`:''}
    <label for="a-email">Email</label><input id="a-email" type="email" autocomplete="email" required>
    <label for="a-pw">Password</label><input id="a-pw" type="password" autocomplete="${mode==='signup'?'new-password':'current-password'}" minlength="8" required>

    <button class="btn pri" id="a-go">${mode==='signup'?'Create account':'Sign in'}</button>

  </form>`;

function tasksFor(key){
  const L = live(), t = TODAY();
  if(key==='today') return L.filter(x=>(x.due && x.due<=t && !x.done) || (x.done && x.due===t));
  if(key==='tomorrow') return L.filter(x=>x.due===ymd(addDays(todayD(),1)));
  if(key==='week') return L.filter(x=>x.due && x.due<=ymd(addDays(todayD(),6)) && (!x.done || x.due>=t));
  if(key==='all') return L;
  if(key==='assigned') return L.filter(x=>x.assignee===me());
  if(key==='completed') return L.filter(x=>x.done);
  if(key==='trash') return allTasks().filter(x=>x.deleted);
  if(key.startsWith('tag:')) return L.filter(x=>(x.tags||[]).includes(key.slice(4)));
  return L.filter(x=>x.listId===key);
}

   Task list view
   ===================================================================== */
function sectionsFor(key, tasks){
  if(key==='completed'){
    const by = {}; tasks.sort((a,b)=>b.doneAt-a.doneAt).forEach(t=>{ const k=ymd(new Date(t.doneAt||t.created)); (by[k]=by[k]||[]).push(t); });
    return Object.entries(by).map(([k,v])=>({id:'c'+k,name:fmtDue(k)||k,tasks:v}));
  }
  if(key==='trash') return [{id:'trash',name:'Deleted',tasks}];
  const open = sortTasks(tasks.filter(t=>!t.done)), done = tasks.filter(t=>t.done).sort((a,b)=>b.doneAt-a.doneAt);
  const t = TODAY(), tm = ymd(addDays(todayD(),1)), wk = ymd(addDays(todayD(),6));
  let secs;
  if(key==='week'){
    secs = [{id:'over',name:'Overdue',tasks:open.filter(x=>x.due<t)}];
    for(let i=0;i<7;i++){ const d=ymd(addDays(todayD(),i)), dd=parseYmd(d); secs.push({id:'d'+d, name:i===0?'Today':i===1?'Tomorrow':`${DOW[dd.getDay()]}, ${MON[dd.getMonth()]} ${dd.getDate()}`, tasks:open.filter(x=>x.due===d), due:d, keep:true}); }
  } else {
    secs = [
      {id:'over',name:'Overdue',tasks:open.filter(x=>x.due && x.due<t)},
      {id:'today',name:'Today',tasks:open.filter(x=>x.due===t),due:t},
      {id:'tom',name:'Tomorrow',tasks:open.filter(x=>x.due===tm),due:tm},
      {id:'next',name:'Next 7 Days',tasks:open.filter(x=>x.due>tm && x.due<=wk)},
      {id:'later',name:'Later',tasks:open.filter(x=>x.due>wk)},
      {id:'nod',name:'No Date',tasks:open.filter(x=>!x.due),due:'none'},
    ];
  }
  secs = secs.filter(s=>s.tasks.length || (s.keep && key==='week'));
  if(done.length) secs.push({id:'done',name:'Completed',tasks:done});
  return secs;
}

function renderTasks(){
  const key = ui.listKey, main = $('#main');
  const tasks = tasksFor(key), secs = sectionsFor(key, tasks);
  const isListKey = !!S.lists[key] || key===inboxId();
  const canAdd = !['completed','trash'].includes(key) && (!isListKey || canWrite(key));
  const showList = !isListKey;
  const l = S.lists[key];
  const badge = l && isShared(l) ? `<span class="badge">${l.ownerId===me()?'Shared':(canWrite(key)?'Shared with you':'View only')}</span>` : '';
  main.innerHTML = `
    <div class="topbar">
      <button class="icon-btn menu-toggle" id="menu-btn" aria-label="Lists">${I.menu}</button>
      <h1>${esc(keyTitle(key))}${badge}</h1>

function bindQuickAdd(input, chipsEl, defaults){
  input.oninput = () => { const p = parseQuick(input.value); chipsEl.innerHTML = p.chips.map(c=>`<span class="chip ${c.cls}">${esc(c.txt)}</span>`).join(''); };
  input.onkeydown = e => {
    if(e.key==='Escape'){ input.value=''; input.oninput(); input.blur(); }
    if(e.key!=='Enter' || e.isComposing) return;
    const p = parseQuick(input.value);
    if(!p.title) return;
    const d = defaults(p);
    let listId = d.listId || inboxId();
    if(p.listName){ const l = userLists().find(x=>x.name.toLowerCase()===p.listName.toLowerCase()); if(l && canWrite(l.id)) listId = l.id; }
    const t = newTask({title:p.title, listId, due:p.due??d.due??null, time:p.time, priority:p.priority??d.priority??0, tags:[...new Set([...(d.tags||[]),...p.tags])], repeat:p.repeat, reminders:p.time?[0]:[], assignee:d.assignee||null});
    touch(t);
    if(t.reminders.length) askNotify(false);
    input.value=''; chipsEl.innerHTML='';
    render(); const again = document.getElementById(input.id); if(again) again.focus();
  };
}

/* ---------------- task actions ---------------- */
let undoFn = null, toastTimer;
function toast(msg, undo){
  $('#toast-msg').textContent = msg; undoFn = undo || null;
  $('#toast-undo').style.display = undo ? '' : 'none';
  $('#toast').classList.add('on'); clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>$('#toast').classList.remove('on'), 4000);
}
$('#toast-undo').onclick = ()=>{ if(undoFn) undoFn(); undoFn=null; $('#toast').classList.remove('on'); };
function toggleDone(id, rowEl){
  const t = S.tasks[id]; if(!t || !guard(t)) return;
  if(t.deleted){ touch({...t, deleted:false}); render(); toast('Task restored'); return; }
  if(!t.done && t.repeat && t.due) return completeRepeating(t, rowEl);
  const was = clone(t);
  Object.assign(t, {done:!t.done, doneAt:!t.done?Date.now():null, snooze:null}); touch(t);
  dismissReminder(id);
  if(t.done){
    animateOut(rowEl);
    toast('Completed', ()=>{ touch(Object.assign(S.tasks[id], {done:false, doneAt:null})); render(); });
  } else render();
}
function animateOut(rowEl){ if(rowEl){ rowEl.classList.add('done','leaving'); rowEl.querySelector('[data-cb]')?.classList.add('on'); setTimeout(render, 420); } else render(); }
function completeRepeating(t, rowEl){
  const r = t.repeat, before = clone(t);
  const base = r.from==='completion' ? TODAY() : t.due;
  let next = nextDue(r, base);
  if(r.from!=='completion') while(next < TODAY() && next < (r.until||'9999')) next = nextDue(r, next);  // skip missed occurrences
  const finished = (r.until && next > r.until) || (r.count && (r.done||0)+1 >= r.count);
  if(finished){ Object.assign(t, {done:true, doneAt:Date.now(), snooze:null}); touch(t); animateOut(rowEl); toast('Completed — last occurrence'); return; }
  const copy = {...clone(t), id:uid(), done:true, doneAt:Date.now(), repeat:null, reminders:[], snooze:null, repeatOf:t.id, created:Date.now(), order:Date.now()};
  touch(copy);
  Object.assign(t, {due:next, snooze:null, items:(t.items||[]).map(i=>({...i, done:false})), repeat:{...r, done:(r.done||0)+1}});
  touch(t); dismissReminder(t.id);
  animateOut(rowEl);
  toast(`Next: ${fmtDue(t.due, t.time)}`, ()=>{ touch({...S.tasks[copy.id], removed:true}); touch(Object.assign(S.tasks[t.id], {...before, mtime:S.tasks[t.id].mtime})); render(); });
}
function del(id){
  const t = S.tasks[id]; if(!t || !guard(t)) return;
  if(t.deleted){ touch({...t, removed:true}); }
  else { touch({...t, deleted:true}); toast('Moved to Trash', ()=>{ touch({...S.tasks[id], deleted:false}); render(); }); }
  if(ui.sel===id) ui.sel=null;
  dismissReminder(id); render();
}
function taskMenu(anchor, id){
  const t = S.tasks[id]; if(!t) return;
  if(!canWrite(t.listId)) return toast('View only');
  if(t.deleted) return menu(anchor, [['Restore', ()=>toggleDone(id)], ['Delete forever', ()=>del(id)]]);
  const set = o => { touch(Object.assign(t,o)); render(); };
  menu(anchor, [
    ['Today', ()=>set({due:TODAY()})], ['Tomorrow', ()=>set({due:ymd(addDays(todayD(),1))})], ['Next week', ()=>set({due:nextMonday()})],
    ['Priority: High', ()=>set({priority:5})], ['Priority: Medium', ()=>set({priority:3})], ['Priority: Low', ()=>set({priority:1})], ['Priority: None', ()=>set({priority:0})],
    ['Duplicate', ()=>{ touch({...clone(t), id:uid(), created:Date.now(), order:ord(t)+1, done:false, doneAt:null}); render(); }],
    ['Delete', ()=>del(id)],
  ]);
}

  document.body.appendChild(popEl);
  const r = anchor.getBoundingClientRect(), pw = popEl.offsetWidth, ph = popEl.offsetHeight;
  let x = Math.min(r.left, innerWidth - pw - 8), y = r.bottom + 6;

  popEl.addEventListener('mousedown', e=>e.stopPropagation());

   ===================================================================== */
const firedKey = () => 'xairos.fired.'+me();
function reminderTimes(t){
  const out = [];

  if(t.due && t.reminders?.length){
    const base = parseYmd(t.due);
    if(t.time){ const [hh,mm] = t.time.split(':'); base.setHours(+hh, +mm); } else base.setHours(9,0);
    for(const m of t.reminders) out.push({key:`${t.id}|${t.due}|${t.time||''}|${m}`, at: base.getTime() - m*6e4});
  }
  if(t.snooze) out.push({key:`${t.id}|snooze|${t.snooze}`, at:t.snooze});
  return out;
}
function checkReminders(){
  if(!session || !S) return;
  const now = Date.now(), fired = lsGet(firedKey()) || {};
  let changed = false;
  for(const t of live()){
    if(t.assignee && t.assignee!==me()) continue;  // only remind the assignee on shared tasks
    for(const r of reminderTimes(t)){
      if(r.at <= now && !fired[r.key]){
        fired[r.key] = now; changed = true;
        if(now - r.at < 6*36e5) notifyTask(t);
      }
    }
  }
  if(changed){
    for(const k in fired) if(now - fired[k] > 30*864e5) delete fired[k];
    lsSet(firedKey(), fired);
  }
}
setInterval(checkReminders, 15000);
function askNotify(explicit){
  if(!('Notification' in window)) { if(explicit) toast('This browser does not support notifications'); return; }
  if(Notification.permission==='default') Notification.requestPermission().then(p=>{ if(explicit) toast(p==='granted'?'Notifications enabled':'Notifications not enabled'); });
  else if(explicit) toast(Notification.permission==='granted' ? 'Notifications are on' : 'Notifications are blocked in browser settings');
}
function beep(){
  try{ const ctx = new (window.AudioContext||window.webkitAudioContext)(); const o = ctx.createOscillator(), g = ctx.createGain();
    o.type='sine'; o.frequency.value=880; g.gain.setValueAtTime(.0001,ctx.currentTime); g.gain.exponentialRampToValueAtTime(.15,ctx.currentTime+.02); g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.5);
    o.connect(g).connect(ctx.destination); o.start(); o.stop(ctx.currentTime+.55); }catch(e){}
}
function notifyTask(t){
  beep();
  if('Notification' in window && Notification.permission==='granted'){
    try{ const n = new Notification(t.title||'Reminder', {body: fmtDue(t.due,t.time) || 'Reminder', tag:t.id}); n.onclick = ()=>{ window.focus(); openTask(t.id); n.close(); }; }catch(e){}
  }
  const stack = $('#rem-stack');
  if(stack.querySelector(`[data-rid="${t.id}"]`)) return;
  const card = h(`<div class="rem-card" data-rid="${t.id}" role="alert">
    <div class="rem-h">${I.bell}<span>Reminder</span><button class="icon-btn" data-x aria-label="Dismiss">${I.close}</button></div>
    <div class="rem-t">${esc(t.title||'Untitled')}</div><div class="rem-s">${esc(fmtDue(t.due,t.time))}${t.due?' · '+esc(listName(t.listId)):''}</div>
    <div class="rem-b"><button class="btn pri" data-c>Complete</button><button class="btn sec" data-s>Snooze</button><button class="btn sec" data-o>Open</button></div></div>`);
  stack.appendChild(card);
  $('[data-x]',card).onclick = ()=> card.remove();
  $('[data-o]',card).onclick = ()=>{ card.remove(); openTask(t.id); };
  $('[data-c]',card).onclick = ()=>{ card.remove(); const x=S.tasks[t.id]; if(x && !x.done) toggleDone(t.id); };
  $('[data-s]',card).onclick = e => {
    const snooze = ms => { card.remove(); const x=S.tasks[t.id]; if(!x || !guard(x)) return; touch(Object.assign(x,{snooze:Date.now()+ms})); render(); toast('Snoozed'); };
    const tm9 = addDays(todayD(),1); tm9.setHours(9,0);
    menu(e.currentTarget, [['5 minutes',()=>snooze(5*6e4)],['15 minutes',()=>snooze(15*6e4)],['30 minutes',()=>snooze(30*6e4)],['1 hour',()=>snooze(36e5)],['Tomorrow 9:00',()=>snooze(tm9-Date.now())]]);
  };
}

/* =====================================================================
   Drag & drop (HTML5 — mouse/trackpad; touch is on the roadmap)
   ===================================================================== */
let drag = null, marked = null;
function makeDraggable(el, id){
  el.draggable = true;
  el.ondragstart = e => { drag = {id}; e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain', id); requestAnimationFrame(()=>el.classList.add('dragging')); closePop(); };
  el.ondragend = () => { el.classList.remove('dragging'); clearMark(); drag = null; };
}
function clearMark(){ if(marked){ marked.classList.remove('drop-over','drop-before','drop-after'); marked = null; } }
document.addEventListener('dragover', e => {
  if(!drag) return;
  const z = e.target.closest('[data-drop]');
  if(z!==marked) clearMark();
  if(!z || (z.dataset.drop==='row' && z.dataset.id===drag.id)) return;
  e.preventDefault(); e.dataTransfer.dropEffect = 'move';
  marked = z;
  if(z.dataset.drop==='row'){ const r = z.getBoundingClientRect(), after = e.clientY > r.top + r.height/2; z.classList.toggle('drop-after',after); z.classList.toggle('drop-before',!after); }
  else z.classList.add('drop-over');
});
document.addEventListener('drop', e => {
  if(!drag) return;
  const z = e.target.closest('[data-drop]'); if(!z) return;
  e.preventDefault();
  const after = z.classList.contains('drop-after');
  clearMark(); handleDrop(z, after);
});
function zoneProps(t, zone){
  if(!zone) return;
  if(zone.dataset.due) t.due = zone.dataset.due==='none' ? null : zone.dataset.due;
  if(zone.dataset.pri!==undefined) t.priority = +zone.dataset.pri;
  if(!t.due){ t.time = null; }
}
function handleDrop(z, after){
  const t = S.tasks[drag.id]; if(!t || !guard(t)) return;
  const kind = z.dataset.drop, v = z.dataset.v;
  if(kind==='row'){
    const target = S.tasks[z.dataset.id]; if(!target) return;
    const zone = z.closest('[data-zone]');
    zoneProps(t, zone);
    const ids = [...(zone||z.parentNode).querySelectorAll('.row[data-id]')].map(r=>r.dataset.id).filter(id=>id!==t.id);
    const idx = ids.indexOf(target.id) + (after?1:0);
    const prev = S.tasks[ids[idx-1]], next = S.tasks[ids[idx]];
    const po = prev ? ord(prev) : null, no = next ? ord(next) : null;
    t.order = po==null && no==null ? Date.now() : po==null ? no-1000 : no==null ? po+1000 : (po+no)/2;
    touch(t); render(); return;
  }
  if(kind==='zone'){ zoneProps(t, z); touch(t); render(); return; }
  if(kind==='list') return moveTo(t, v);
  if(kind==='smart'){ touch(Object.assign(t,{due: v==='today'?TODAY():ymd(addDays(todayD(),1))})); render(); return toast(`Moved to ${v==='today'?'Today':'Tomorrow'}`); }
  if(kind==='tag'){ t.tags = [...new Set([...(t.tags||[]), v])]; touch(t); render(); return toast(`Tagged #${v}`); }
  if(kind==='trash') return del(t.id);
  if(kind==='day'){ touch(Object.assign(t,{due:v})); render(); return; }
}

function renderCalendar(){
  const main = $('#main');

  ui.calMonth = base;
  const start = addDays(base, -base.getDay());
  const days = []; for(let i=0;i<42;i++) days.push(addDays(start,i));
  const from = ymd(days[0]), to = ymd(days[41]);
  const L = live(), byDay = {};
  for(const t of L){
    if(t.due && t.due>=from && t.due<=to) (byDay[t.due]=byDay[t.due]||[]).push({t, ghost:false});
    for(const d of occurrences(t, from, to)) (byDay[d]=byDay[d]||[]).push({t, ghost:true});
  }
  const color = t => t.priority===5 ? 'var(--p-high)' : listColor(t.listId)===COLORS[7] ? 'var(--primary)' : listColor(t.listId);
  main.innerHTML = `
    <div class="topbar">
      <h1>${MON[base.getMonth()]} ${base.getFullYear()}</h1>
      <button class="btn sec" style="flex:none;height:30px" id="c-today">Today</button>
      <button class="icon-btn" id="c-prev" aria-label="Previous month">${I.left}</button>
      <button class="icon-btn" id="c-next" aria-label="Next month">${I.right}</button>
    </div>
    <div class="content cal">
      <div class="cal-dow">${DOW.map(d=>`<div>${d}</div>`).join('')}</div>
      <div class="cal-grid">${days.map(d=>{
        const k = ymd(d), items = (byDay[k]||[]).sort((a,b)=>a.ghost-b.ghost || (a.t.time||'99').localeCompare(b.t.time||'99'));
        const max = 3;
        return `<div class="cell ${d.getMonth()!==base.getMonth()?'other':''} ${k===TODAY()?'today':''}" data-day="${k}" data-drop="day" data-v="${k}"><div class="d">${d.getDate()}</div>${items.slice(0,max).map(({t,ghost})=>`<div class="ev ${t.done?'done':''} ${ghost?'ghost':''}" data-id="${t.id}" ${ghost?'title="Upcoming repeat"':''} style="--c:${color(t)}">${t.time?fmtTime(t.time).replace(' ','')+' ':''}${esc(t.title)}</div>`).join('')}${items.length>max?`<div class="more">+${items.length-max} more</div>`:''}</div>`;
      }).join('')}</div>
    </div>`;
  $('#c-prev').onclick = ()=>{ ui.calMonth = new Date(base.getFullYear(), base.getMonth()-1, 1); renderCalendar(); };
  $('#c-next').onclick = ()=>{ ui.calMonth = new Date(base.getFullYear(), base.getMonth()+1, 1); renderCalendar(); };
  $('#c-today').onclick = ()=>{ ui.calMonth = null; renderCalendar(); };
  main.querySelectorAll('.ev').forEach(e=>{
    e.onclick = ev => { ev.stopPropagation(); select(e.dataset.id); };
    const t = S.tasks[e.dataset.id];
    if(!e.classList.contains('ghost') && t && canWrite(t.listId)) makeDraggable(e, t.id);
  });
  main.querySelectorAll('.cell').forEach(c=> c.ondblclick = ()=>{ const t = newTask({due:c.dataset.day}); touch(t); select(t.id); });
}

const F = { mode:'pomo', len:25*60, left:25*60, running:false, startedAt:null, tick:null, sw:0, task:'' };
const fmtClock = s => { s=Math.max(0,Math.round(s)); return `${pad(Math.floor(s/60))}:${pad(s%60)}`; };

  const R = 130, C = 2*Math.PI*R;

          ${F.running ? `<button class="btn sec" id="f-pause">Pause</button>` : `<button class="btn pri" id="f-start">${(F.mode==='pomo'?F.left<F.len:F.sw>0)?'Continue':'Start'}</button>`}

          <div class="stat"><div class="k">Total Pomos</div><div class="v">${recs.filter(f=>f.mins>=20).length}</div></div>
          <div class="stat"><div class="k">Total Focus</div><div class="v">${Math.floor(all/60)}h ${all%60}m</div></div>
        </div>
        <div class="sec-h" style="cursor:default">Focus Record</div>
        ${recs.slice().reverse().slice(0,20).map(f=>{ const d=new Date(f.start), e=new Date(f.start+f.mins*6e4); return `<div class="rec"><span>${fmtDue(ymd(d))} · ${pad(d.getHours())}:${pad(d.getMinutes())}–${pad(e.getHours())}:${pad(e.getMinutes())}<br><span style="color:var(--t3);font-size:12px">${esc(f.task||'Focus')}</span></span><span>${f.mins}m</span></div>`; }).join('') || '<div style="color:var(--t3);font-size:13px">No records yet</div>'}

function startFocus(){
  F.running = true; if(!F.startedAt) F.startedAt = Date.now();

  F.tick = setInterval(()=>{
    const now = Date.now(), dt = (now-last)/1000; last = now;
    if(F.mode==='pomo'){ F.left -= dt; if(F.left<=0){ F.left=0; endFocus(false); beep(); try{ if(Notification.permission==='granted') new Notification('Focus complete', {body:'Time for a break.'}); }catch(e){} return; } }
    else F.sw += dt;
    if(ui.route==='focus'){
      const el = $('#f-time'); if(el) el.textContent = F.mode==='pomo'?fmtClock(F.left):fmtClock(F.sw);
      const arc = $('#f-arc'); if(arc){ const C=2*Math.PI*130; const frac = F.mode==='pomo'?1-F.left/F.len:(F.sw%3600)/3600; arc.setAttribute('stroke-dashoffset', C*(1-frac)); }
    }
    document.title = F.running ? `${F.mode==='pomo'?fmtClock(F.left):fmtClock(F.sw)} · xairos` : 'xairos';
  }, 250);
  renderFocus();
}
function endFocus(manual){
  clearInterval(F.tick);
  const mins = Math.round((F.mode==='pomo' ? (F.len-F.left) : F.sw)/60);
  if(mins>=1) upd('focus', {id:uid(), start:F.startedAt||Date.now(), mins, task:F.task});
  F.running=false; F.left=F.len; F.sw=0; F.startedAt=null; document.title='xairos';
  if(!manual) toast('Pomo complete — take a break');
  if(ui.route==='focus') renderFocus();
}

  if(e.key==='Escape'){ if(popEl) return closePop(); if(ui.sel && !typing){ ui.sel=null; render(); } if(typing) document.activeElement.blur(); return; }
  if(typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if(e.key==='n'){ e.preventDefault(); if(ui.route!=='tasks') go('#/tasks/'+encodeURIComponent(ui.listKey)); setTimeout(()=>$('#qa')?.focus()); }
  if(e.key==='/'){ e.preventDefault(); go('#/search'); }
  const views = {'1':'#/tasks/today','2':'#/calendar','3':'#/matrix','4':'#/focus','5':'#/habits'};
  if(views[e.key]) go(views[e.key]);
});
matchMedia('(prefers-color-scheme:dark)').addEventListener('change', ()=>{ if(prefs.theme==='system') render(); });
let rT; addEventListener('resize', ()=>{ clearTimeout(rT); rT=setTimeout(()=>{ if(session) renderDetail(); },120); });

/* ---------------- boot ---------------- */
applyTheme();
if(session){
  saveSession();
  loadLocal();
  $('#app').hidden = false;
  if(!location.hash) location.hash = '#/tasks/today'; else readHash();
  doSync();
  setTimeout(checkReminders, 1500);
} else renderAuth('signin');
</script>
</body>
</html>
